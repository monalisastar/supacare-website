<!-- Bitcoin Logo (Official Style) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Bitcoin logo">
  <!-- Orange circle -->
  <circle cx="128" cy="128" r="128" fill="#f7931a"></circle>
  
  <!-- Tilted "B" -->
  <g transform="rotate(-15 128 128)">
    <!-- vertical strokes -->
    <rect x="94" y="48" width="14" height="160" rx="7" fill="#ffffff"></rect>
    <rect x="122" y="48" width="14" height="160" rx="7" fill="#ffffff"></rect>
    
    <!-- main "B" body -->
    <path d="M108 56h30c22 0 38 10 38 30 0 14-10 24-22 26v2c16 2 28 12 28 28 0 24-18 38-46 38h-28z" fill="#ffffff"></path>
    
    <!-- cutouts to make counters (inner spaces of B) -->
    <ellipse cx="144" cy="86" rx="10" ry="6" fill="#f7931a"></ellipse>
    <ellipse cx="150" cy="142" rx="12" ry="8" fill="#f7931a"></ellipse>
  </g>
</svg>
